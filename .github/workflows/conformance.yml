name: Conformance Suite Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Vectors Integrity (tools/verify_vectors.py)
      run: python3 tools/verify_vectors.py

    - name: Verify Python Mode A Reference (python_ref/verify_golden_ref.py)
      run: python3 python_ref/verify_golden_ref.py

    - name: Verify Python Mode B Reference (python_ref/verify_tagged_ref.py)
      run: python3 python_ref/verify_tagged_ref.py
